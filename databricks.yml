bundle:
  name: energy_forecasting_mlops

workspace:
  host: https://dbc-c6c8d02c-35f6.cloud.databricks.com

resources:
  jobs:
    energy_hourly_pipeline:
      name: "energy_hourly_pipeline"
      schedule:
        quartz_cron_expression: "0 5 * * * ?"
        timezone_id: "UTC"
      max_concurrent_runs: 1
      tasks:
        - task_key: "ingest"
          notebook_task:
            notebook_path: ./notebooks/01_ingest.py
          timeout_seconds: 1800

        - task_key: "transform"
          depends_on:
            - task_key: "ingest"
          notebook_task:
            notebook_path: ./notebooks/02_transform.py
          timeout_seconds: 1800

        - task_key: "drift_check"
          depends_on:
            - task_key: "transform"
          notebook_task:
            notebook_path: ./notebooks/03_drift_check.py
          timeout_seconds: 900

        - task_key: "predict"
          depends_on:
            - task_key: "drift_check"
          notebook_task:
            notebook_path: ./notebooks/04_predict.py
          timeout_seconds: 900

    energy_retraining_pipeline:
      name: "energy_retraining_pipeline"
      schedule:
        quartz_cron_expression: "0 0 2 ? * SUN"
        timezone_id: "UTC"
      max_concurrent_runs: 1
      tasks:
        - task_key: "train_prophet"
          notebook_task:
            notebook_path: ./notebooks/05_train_prophet.py
          timeout_seconds: 3600

        - task_key: "train_lgbm"
          notebook_task:
            notebook_path: ./notebooks/06_train_lgbm.py
          timeout_seconds: 3600

        - task_key: "evaluate"
          depends_on:
            - task_key: "train_prophet"
            - task_key: "train_lgbm"
          notebook_task:
            notebook_path: ./notebooks/07_evaluate.py
          timeout_seconds: 1800

        - task_key: "promote_model"
          depends_on:
            - task_key: "evaluate"
          notebook_task:
            notebook_path: ./notebooks/08_promote_model.py
          timeout_seconds: 900

targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/energy_forecasting_dev
    resources:
      jobs:
        energy_hourly_pipeline:
          schedule:
            pause_status: PAUSED
        energy_retraining_pipeline:
          schedule:
            pause_status: PAUSED

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/energy_forecasting_prod