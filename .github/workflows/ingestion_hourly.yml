name: "Ingestion Hourly"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_date:
        description: "ISO datetime to fetch (e.g. 2024-03-15T14:00:00). Empty = current UTC hour."
        required: false
        default: ""
      lookback_hours:
        description: "How many hours back to fetch (for backfill)"
        required: false
        default: "24"
  schedule:
    - cron: "5 * * * *"

concurrency:
  group: ingestion-pipeline
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VOLUME_BASE: "/Volumes/workspace/energy_forecasting/data/raw_ingestion"
  DATABRICKS_BUNDLE_TARGET: "prod"

jobs:
  fetch_and_upload:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Aggressive CLI Isolation
        run: |
          # 1. Uninstall legacy Python CLI
          python -m pip uninstall -y databricks-cli || true
          
          # 2. Delete any conflicting binaries in system paths
          sudo rm -f /usr/local/bin/databricks || true
          sudo rm -f /usr/bin/databricks || true

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Verify Databricks CLI
        run: databricks -v

      - name: Verify Databricks authentication
        run: |
          echo "Host length: ${#DATABRICKS_HOST}"
          echo "Token length: ${#DATABRICKS_TOKEN}"
          databricks auth describe

      - name: Network Diagnostic
        run: |
          echo "Testing DNS for ENTSO-E..."
          nslookup transparency.entsoe.eu || echo "NSLOOKUP failed"
          curl -I https://transparency.entsoe.eu/api || echo "CURL failed"

      - name: Resolve run parameters
        shell: bash
        run: |
          # Use workflow inputs if available, otherwise use defaults
          INPUT_DATE="${{ github.event.inputs.run_date }}"
          INPUT_LOOKBACK="${{ github.event.inputs.lookback_hours }}"
          
          if [ -n "$INPUT_DATE" ]; then
            RUN_DATE="$INPUT_DATE"
          else
            RUN_DATE=$(python -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).replace(minute=0, second=0, microsecond=0).isoformat())")
          fi
          
          if [ -n "$INPUT_LOOKBACK" ]; then
            LOOKBACK_HOURS="$INPUT_LOOKBACK"
          else
            LOOKBACK_HOURS="24"
          fi
          
          echo "RUN_DATE=$RUN_DATE" >> $GITHUB_ENV
          echo "LOOKBACK_HOURS=$LOOKBACK_HOURS" >> $GITHUB_ENV
          echo "Resolved RUN_DATE=$RUN_DATE, LOOKBACK_HOURS=$LOOKBACK_HOURS"

      - name: Fetch and segment data
        shell: bash
        env:
          ENTSO_E_API_KEY: ${{ secrets.ENTSO_E_API_KEY }}
          PYTHONPATH: "."
        run: |
          python3 - <<'EOF'
          import os
          import sys
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import pandas as pd
          from src.api_client import EntsoEClient, OpenMeteoClient
          from src.config import ENTSO_E_MAX_RANGE_DAYS

          try:
              run_dt = datetime.fromisoformat(os.environ["RUN_DATE"]).replace(tzinfo=timezone.utc)
              lookback = int(os.environ["LOOKBACK_HOURS"])
              fetch_start = run_dt - timedelta(hours=lookback)
              fetch_end = run_dt

              # Create local directories
              Path("/tmp/load").mkdir(parents=True, exist_ok=True)
              Path("/tmp/temperature").mkdir(parents=True, exist_ok=True)

              print(f"Fetching window: {fetch_start} to {fetch_end}")

              # 1. Fetch Load Data
              load_df = pd.DataFrame()
              load_status = "ok"
              load_error = ""
              try:
                  client = EntsoEClient()
                  # Chunking for large lookbacks
                  chunks = []
                  curr_start = fetch_start
                  while curr_start < fetch_end:
                      curr_end = min(curr_start + timedelta(days=7), fetch_end)
                      print(f"Fetching load chunk: {curr_start} to {curr_end}")
                      chunk_df = client.fetch_actual_load(curr_start, curr_end)
                      if not chunk_df.empty:
                          chunks.append(chunk_df)
                      curr_start = curr_end
                  
                  if chunks:
                        load_df = pd.concat(chunks).drop_duplicates(subset=["timestamp"], keep="last")
                        # ENTSO-E may return 15-min or 30-min data — aggregate to hourly
                        load_df = load_df.set_index("timestamp").resample("h").agg({
                            "value_mwh": "mean",
                            "country": "first",
                            "source": "first",
                            "fetched_at": "first"
                        }).reset_index()
                  else:
                        load_status = "empty"
              except Exception as e:
                  print(f"ENTSO-E fetch failed: {e}")
                  load_status = "fetch_failed"
                  load_error = str(e)

              # 2. Fetch Temperature Data
              temp_df = pd.DataFrame()
              temp_status = "ok"
              temp_error = ""
              try:
                  temp_client = OpenMeteoClient()
                  temp_df = temp_client.fetch_weather(fetch_start.date(), fetch_end.date())
                  weather_cols = ["temperature_c", "humidity_pct", "cloud_cover_pct"]
                  temp_df = temp_client._fallback_weather(temp_df, weather_cols)
              except Exception as e:
                  print(f"OpenMeteo fetch failed: {e}")
                  temp_status = "fetch_failed"
                  temp_error = str(e)

              if temp_status == "ok" and temp_df.empty:
                  temp_status = "empty"

              # 3. Segment and Save hourly files
              # Only hours that actually have data get a file. Uploads use
              # --overwrite, so writing a failure wrapper or [] placeholder here
              # could replace a good, not-yet-ingested file for the same hour
              # (spec 012). Missing hours are re-fetched by later runs (24h lookback).
              load_files = 0
              temp_files = 0
              current_h = fetch_start
              while current_h < fetch_end:
                  h_start = current_h
                  h_end = current_h + timedelta(hours=1)
                  filename = h_start.strftime("%Y-%m-%dT%H-00-00Z.json")

                  # Load slice
                  if load_status == "ok":
                      h_load = load_df[(load_df['timestamp'] >= h_start) & (load_df['timestamp'] < h_end)].copy()
                      if not h_load.empty:
                          h_load["timestamp"] = h_load["timestamp"].dt.strftime("%Y-%m-%dT%H:%M:%S+00:00")
                          h_load["fetched_at"] = h_load["fetched_at"].dt.strftime("%Y-%m-%dT%H:%M:%S+00:00")
                          h_load.to_json(f"/tmp/load/{filename}", orient="records")
                          load_files += 1

                  # Temperature slice
                  if temp_status == "ok":
                      h_temp = temp_df[(temp_df['timestamp'] >= h_start) & (temp_df['timestamp'] < h_end)].copy()
                      if not h_temp.empty:
                          h_temp["timestamp"] = h_temp["timestamp"].dt.strftime("%Y-%m-%dT%H:%M:%S+00:00")
                          h_temp["fetched_at"] = h_temp["fetched_at"].dt.strftime("%Y-%m-%dT%H:%M:%S+00:00")
                          h_temp.to_json(f"/tmp/temperature/{filename}", orient="records")
                          temp_files += 1

                  current_h = h_end

              print(f"Load rows fetched: {len(load_df)} ({load_status}), files written: {load_files}")
              print(f"Temperature rows fetched: {len(temp_df)} ({temp_status}), files written: {temp_files}")

              # Recorded for the final step, which fails the run so a broken
              # source is visible. Upload and trigger still run for whatever succeeded.
              # Status names only: error text can span lines and would corrupt GITHUB_ENV.
              failures = []
              if load_status != "ok":
                  failures.append(f"ENTSO-E load {load_status}")
              if temp_status != "ok":
                  failures.append(f"OpenMeteo weather {temp_status}")
              with open(os.environ["GITHUB_ENV"], "a") as env_file:
                  env_file.write(f"LOAD_STATUS={load_status}\n")
                  env_file.write(f"TEMP_STATUS={temp_status}\n")
                  env_file.write(f"FETCH_FAILURES={', '.join(failures)}\n")

          except Exception as fatal:
              print(f"CRITICAL ERROR in Python script: {fatal}")
              sys.exit(1)
          EOF

      - name: Fetch as-issued weather forecasts
        # Spec 019: forecasts for the 24h model. A failed fetch only warns: each
        # target hour is covered by the fetches of the previous two days.
        shell: bash
        run: |
          python -m src.weather_forecast --days-back 3 --days-ahead 2 --out /tmp/weather_forecast \
            || echo "::warning::Weather forecast fetch failed; earlier fetches still cover the next 24h."

      - name: Ensure Volume directories exist
        shell: bash
        run: |
          # Ensure Volume directories exist
          databricks fs mkdirs \
            "dbfs:/Volumes/workspace/energy_forecasting/data/raw_ingestion/load" \
            2>/dev/null || true
          databricks fs mkdirs \
            "dbfs:/Volumes/workspace/energy_forecasting/data/raw_ingestion/temperature" \
            2>/dev/null || true
          databricks fs mkdirs \
            "dbfs:/Volumes/workspace/energy_forecasting/data/raw_ingestion/archive/load" \
            2>/dev/null || true
          databricks fs mkdirs \
            "dbfs:/Volumes/workspace/energy_forecasting/data/raw_ingestion/archive/temperature" \
            2>/dev/null || true
          databricks fs mkdirs \
            "dbfs:/Volumes/workspace/energy_forecasting/data/raw_ingestion/weather_forecast" \
            2>/dev/null || true
          echo "Volume directories ready."

      - name: Upload JSON files to Databricks Volume
        shell: bash
        run: |
          LOAD_COUNT=0
          TEMP_COUNT=0
          
          for f in /tmp/load/*.json; do
            [ -e "$f" ] || continue
            filename=$(basename "$f")
            databricks fs cp \
              "$f" \
              "dbfs:/Volumes/workspace/energy_forecasting/data/raw_ingestion/load/${filename}" \
              --overwrite
            LOAD_COUNT=$((LOAD_COUNT + 1))
            echo "Uploaded load: $filename"
          done
          
          for f in /tmp/temperature/*.json; do
            [ -e "$f" ] || continue
            filename=$(basename "$f")
            databricks fs cp \
              "$f" \
              "dbfs:/Volumes/workspace/energy_forecasting/data/raw_ingestion/temperature/${filename}" \
              --overwrite
            TEMP_COUNT=$((TEMP_COUNT + 1))
            echo "Uploaded temp: $filename"
          done
          
          FORECAST_COUNT=0
          for f in /tmp/weather_forecast/*.json; do
            [ -e "$f" ] || continue
            databricks fs cp \
              "$f" \
              "dbfs:/Volumes/workspace/energy_forecasting/data/raw_ingestion/weather_forecast/$(basename "$f")" \
              --overwrite
            FORECAST_COUNT=$((FORECAST_COUNT + 1))
          done

          echo "Upload complete: $LOAD_COUNT load files, $TEMP_COUNT temperature files, $FORECAST_COUNT weather forecast files."
          
          if [ "$LOAD_COUNT" -eq 0 ]; then
            echo "::warning::No load files were uploaded. Check the fetch step."
          fi

      - name: Trigger Databricks Workflow
        shell: bash
        run: |
          JOB_ID=$(databricks jobs list --output json | \
            python3 -c "import json, sys; data = json.load(sys.stdin); jobs = data if isinstance(data, list) else data.get('jobs', []); match = [j for j in jobs if j.get('settings', {}).get('name') == 'energy_hourly_pipeline']; print(match[0]['job_id'] if match else '')")
          
          if [ -z "$JOB_ID" ]; then
            echo "::warning::Job 'energy_hourly_pipeline' not found - skipping trigger."
            exit 0
          fi
          
          RUN_RESPONSE=$(databricks jobs run-now "$JOB_ID" --no-wait --output json)
          RUN_ID=$(echo "$RUN_RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['run_id'])")
          
          echo "Triggered job run: $RUN_ID"
          echo "DATABRICKS_RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Write job summary
        shell: bash
        run: |
          echo "## Ingestion Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Run date | $RUN_DATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Lookback hours | $LOOKBACK_HOURS |" >> $GITHUB_STEP_SUMMARY
          echo "| Databricks run ID | ${DATABRICKS_RUN_ID:-not triggered} |" >> $GITHUB_STEP_SUMMARY
          echo "| ENTSO-E load fetch | ${LOAD_STATUS:-unknown} |" >> $GITHUB_STEP_SUMMARY
          echo "| OpenMeteo weather fetch | ${TEMP_STATUS:-unknown} |" >> $GITHUB_STEP_SUMMARY
          if [ -n "$FETCH_FAILURES" ]; then
            echo "| Status | ❌ Fetch failed: $FETCH_FAILURES |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Status | ✅ Files uploaded & Pipeline triggered |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on fetch errors
        if: env.FETCH_FAILURES != ''
        shell: bash
        run: |
          echo "::error::Source fetch failed: $FETCH_FAILURES"
          exit 1
